components:
  parameters:
    RoleId: {name: roleId, in: path, required: true, schema: {type: string, format: uuid}}
    UserId: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    BindingId: {name: bindingId, in: path, required: true, schema: {type: string, format: uuid}}
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Exact role policyVersion token returned as the ETag header. If omitted, the request body policyVersion is used.
      schema: {type: string}
    Search: {name: q, in: query, required: false, schema: {type: string}}
    Page: {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
  responses:
    Unauthorized:
      description: Authentication required
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Forbidden:
      description: Authorization denied
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    BadRequest:
      description: Invalid request
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    NotFound:
      description: Resource not found
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Conflict:
      description: Policy version or resource conflict
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    PreconditionRequired:
      description: An exact policy version precondition is required
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
  schemas:
    RegistryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        code: {type: [string, "null"], maxLength: 100}
        description: {type: [string, "null"], maxLength: 4000}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    PortfolioImportResult:
      type: object
      required: [imported, importId]
      properties:
        imported: {type: integer, minimum: 1}
        importId: {type: string, format: uuid}
    PortfolioImportPreview:
      type: object
      additionalProperties: false
      required: [total, facilities, buildings, spaces, systems, assets, facilityGroups]
      properties:
        total: {type: integer, minimum: 1}
        facilities: {type: integer, minimum: 0}
        buildings: {type: integer, minimum: 0}
        spaces: {type: integer, minimum: 0}
        systems: {type: integer, minimum: 0}
        assets: {type: integer, minimum: 0}
        facilityGroups:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioImportFacilityGroup"
    PortfolioImportFacilityGroup:
      type: object
      additionalProperties: false
      required: [name, clientRef, counts, records]
      properties:
        name: {type: string}
        clientRef: {type: string}
        id: {type: [string, "null"], format: uuid}
        code: {type: [string, "null"]}
        counts:
          type: object
          additionalProperties: false
          required: [buildings, spaces, systems, assets]
          properties:
            buildings: {type: integer, minimum: 0}
            spaces: {type: integer, minimum: 0}
            systems: {type: integer, minimum: 0}
            assets: {type: integer, minimum: 0}
        records:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioImportPreviewRecord"
    PortfolioImportPreviewRecord:
      type: object
      additionalProperties: false
      required: [row, kind, name, clientRef, status]
      properties:
        row: {type: integer, minimum: 2}
        kind: {type: string, enum: [BUILDING, SPACE, SYSTEM, ASSET]}
        name: {type: string}
        clientRef: {type: string}
        id: {type: [string, "null"], format: uuid}
        parentRef: {type: [string, "null"]}
        systemRef: {type: [string, "null"]}
        code: {type: [string, "null"]}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    BuildingInput:
      allOf:
        - $ref: "#/components/schemas/RegistryInput"
        - type: object
          required: [facilityId]
          properties: {facilityId: {type: string, format: uuid}}
    SpaceInput:
      allOf:
        - $ref: "#/components/schemas/RegistryInput"
        - type: object
          required: [buildingId]
          properties: {buildingId: {type: string, format: uuid}}
    SystemInput:
      allOf:
        - $ref: "#/components/schemas/RegistryInput"
        - type: object
          required: [spaceId]
          properties: {spaceId: {type: string, format: uuid}}
    AssetInput:
      allOf:
        - $ref: "#/components/schemas/RegistryInput"
        - type: object
          required: [spaceId]
          properties:
            spaceId: {type: string, format: uuid}
            systemId: {type: [string, "null"], format: uuid}
    Facility:
      allOf:
        - $ref: "#/components/schemas/RegistryRecord"
    Building:
      allOf:
        - $ref: "#/components/schemas/RegistryRecord"
        - type: object
          required: [facilityId]
          properties: {facilityId: {type: string, format: uuid}}
    Space:
      allOf:
        - $ref: "#/components/schemas/RegistryRecord"
        - type: object
          required: [facilityId, buildingId]
          properties:
            facilityId: {type: string, format: uuid}
            buildingId: {type: string, format: uuid}
    System:
      allOf:
        - $ref: "#/components/schemas/RegistryRecord"
        - type: object
          required: [facilityId, buildingId, spaceId]
          properties:
            facilityId: {type: string, format: uuid}
            buildingId: {type: string, format: uuid}
            spaceId: {type: string, format: uuid}
    Asset:
      allOf:
        - $ref: "#/components/schemas/RegistryRecord"
        - type: object
          required: [facilityId, buildingId, spaceId]
          properties:
            facilityId: {type: string, format: uuid}
            buildingId: {type: string, format: uuid}
            spaceId: {type: string, format: uuid}
            systemId: {type: [string, "null"], format: uuid}
    RegistryRecord:
      type: object
      required: [id, organizationId, name, status, capabilities]
      properties:
        id: {type: string, format: uuid}
        organizationId: {type: string, format: uuid}
        name: {type: string}
        code: {type: [string, "null"]}
        description: {type: [string, "null"]}
        status: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        capabilities:
          $ref: "#/components/schemas/RegistryCapabilities"
    RegistryCapabilities:
      type: object
      description: >-
        Server-evaluated UI actions for this object. create is the permission
        to create another object of this kind in its verified scope. The
        createChildren entries are the safe child-kind semantics for detail
        surfaces; an entry is present only for a valid child kind and is
        never inferred from request input.
      required: [view, create, update, delete, createChildren]
      properties:
        view: {type: boolean}
        create: {type: boolean}
        update: {type: boolean}
        delete: {type: boolean}
        createChildren:
          type: object
          additionalProperties: false
          properties:
            BUILDING: {type: boolean}
            SPACE: {type: boolean}
            SYSTEM: {type: boolean}
            ASSET: {type: boolean}
    RegistryPage:
      type: object
      required: [items, page, limit, total, collectionCapabilities]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RegistryRecord"}
        page: {type: integer}
        limit: {type: integer}
        total: {type: integer}
        collectionCapabilities:
          $ref: "#/components/schemas/RegistryCollectionCapabilities"
    RegistryCollectionCapabilities:
      type: object
      description: Server-evaluated actions for the current authorized collection context.
      required: [create]
      properties:
        create:
          type: boolean
          description: Whether the server permits creating the collection's resource kind in this verified context.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    CanonicalRole:
      type: string
      enum:
        - PLATFORM_ADMIN
        - FACILITY_MANAGER
        - FACILITY_SUPERVISOR
        - INSPECTOR
        - MAINTENANCE_TECHNICIAN
        - WAREHOUSE_SUPERVISOR
        - VENDOR
    UserRoleBindingStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, EXPIRED]
    Organization:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    OrganizationAccess:
      type: object
      required: [organization, role]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        role:
          $ref: "#/components/schemas/CanonicalRole"
    AppUser:
      type: object
      required: [id, externalAuthId, displayName, email]
      properties:
        id:
          type: string
          format: uuid
        externalAuthId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
    AppSession:
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: "#/components/schemas/AppUser"
        activeOrganization:
          oneOf:
            - $ref: "#/components/schemas/OrganizationAccess"
            - type: "null"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationAccess"
    OrganizationSelection:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid
    FoundationSummary:
      type: object
      required:
        - organization
        - currentRole
        - memberCount
        - canonicalRoleCount
        - authenticationStatus
        - organizationContextStatus
        - authorizationStatus
        - auditStatus
      properties:
        organization:
