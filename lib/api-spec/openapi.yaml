openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: NEXUS-FM foundation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: foundation
  - name: authorization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session:
    get:
      operationId: getSession
      tags: [foundation]
      summary: Get the authenticated user's NEXUS-FM session
      responses:
        "200":
          description: Current application session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSession"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User has no active NEXUS-FM membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /organizations:
    get:
      operationId: listOrganizations
      tags: [foundation]
      summary: List organizations available to the authenticated user
      responses:
        "200":
          description: Accessible organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationAccess"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /session/organization:
    put:
      operationId: selectOrganization
      tags: [foundation]
      summary: Select the active organization context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSelection"
      responses:
        "200":
          description: Updated application session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSession"
        "400":
          description: Invalid organization selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Organization access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /foundation/summary:
    get:
      operationId: getFoundationSummary
      tags: [foundation]
      summary: Get foundation readiness for the active organization
      responses:
        "200":
          description: Foundation readiness summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Active organization context required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /authorization/me:
    get:
      operationId: getMyAuthorization
      tags: [authorization]
      summary: Get effective permissions and scopes for the active organization
      responses:
        "200":
          description: Effective authorization profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Active organization context required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /authorization/check:
    post:
      operationId: checkAuthorization
      tags: [authorization]
      summary: Check one canonical permission for the authenticated actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationCheckInput"
      responses:
        "200":
          description: Authorization decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationDecision"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /authorization/permissions:
    get:
      operationId: listPermissionCatalog
      tags: [authorization]
      summary: List the canonical permission catalog
      responses:
        "200":
          description: Canonical permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrative permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /authorization/roles:
    get:
      operationId: listRoleCapabilities
      tags: [authorization]
      summary: List canonical role capability assignments
      responses:
        "200":
          description: Canonical role capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleCapability"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrative permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{userId}/role-bindings:
    get:
      operationId: listUserRoleBindings
      tags: [authorization]
      summary: List scoped role bindings for a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User role bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleBinding"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrative permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/role-bindings:
    post:
      operationId: createRoleBinding
      tags: [authorization]
      summary: Grant a scoped canonical role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleBindingInput"
      responses:
        "201":
          description: Role binding created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBinding"
        "400":
          description: Invalid binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrative permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/role-bindings/{bindingId}:
    patch:
      operationId: updateRoleBinding
      tags: [authorization]
      summary: Update scoped role binding lifecycle
      parameters:
        - $ref: "#/components/parameters/BindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleBindingUpdate"
      responses:
        "200":
          description: Role binding updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBinding"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrative permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Binding not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: revokeRoleBinding
      tags: [authorization]
      summary: Revoke a scoped role binding
      parameters:
        - $ref: "#/components/parameters/BindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleBindingRevocation"
      responses:
        "200":
          description: Role binding revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBinding"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrative permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Binding not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BindingId:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    CanonicalRole:
      type: string
      enum:
        - PLATFORM_ADMIN
        - FACILITY_MANAGER
        - FACILITY_SUPERVISOR
        - INSPECTOR
        - MAINTENANCE_TECHNICIAN
        - WAREHOUSE_SUPERVISOR
        - VENDOR
    Organization:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    OrganizationAccess:
      type: object
      required: [organization, role]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        role:
          $ref: "#/components/schemas/CanonicalRole"
    AppUser:
      type: object
      required: [id, externalAuthId, displayName, email]
      properties:
        id:
          type: string
          format: uuid
        externalAuthId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
    AppSession:
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: "#/components/schemas/AppUser"
        activeOrganization:
          oneOf:
            - $ref: "#/components/schemas/OrganizationAccess"
            - type: "null"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationAccess"
    OrganizationSelection:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid
    FoundationSummary:
      type: object
      required:
        - organization
        - currentRole
        - memberCount
        - canonicalRoleCount
        - authenticationStatus
        - organizationContextStatus
        - authorizationStatus
        - auditStatus
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        currentRole:
          $ref: "#/components/schemas/CanonicalRole"
        memberCount:
          type: integer
          minimum: 0
        canonicalRoleCount:
          type: integer
          minimum: 0
        authenticationStatus:
          type: string
          enum: [READY]
        organizationContextStatus:
          type: string
          enum: [READY]
        authorizationStatus:
          type: string
          enum: [MINIMUM_RBAC]
        auditStatus:
          type: string
          enum: [ACTIVE]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ScopeType:
      type: string
      enum:
        - PLATFORM
        - ORGANIZATION
        - PORTFOLIO
        - FACILITY
        - BUILDING
        - SPACE
        - ASSET
        - ASSIGNED
        - TEAM
        - VENDOR_ASSIGNMENT
        - OWNED_REQUEST
    BindingStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, EXPIRED, REVOKED]
    PermissionEffect:
      type: string
      enum: [ALLOW, DENY]
    Permission:
      type: object
      required: [id, code, resource, action, description, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        resource:
          type: string
        action:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, DEPRECATED]
    RoleCapability:
      type: object
      required: [role, permission, defaultScopeType, effect]
      properties:
        role:
          $ref: "#/components/schemas/CanonicalRole"
        permission:
          type: string
        defaultScopeType:
          $ref: "#/components/schemas/ScopeType"
        effect:
          $ref: "#/components/schemas/PermissionEffect"
    RoleBinding:
      type: object
      required:
        - id
        - userId
        - organizationId
        - role
        - scopeType
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CanonicalRole"
        scopeType:
          $ref: "#/components/schemas/ScopeType"
        scopeId:
          type: ["string", "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/BindingStatus"
        startsAt:
          type: ["string", "null"]
          format: date-time
        endsAt:
          type: ["string", "null"]
          format: date-time
        grantedBy:
          type: ["string", "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoleBindingInput:
      type: object
      additionalProperties: false
      required: [userId, organizationId, role, scopeType, reason]
      properties:
        userId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CanonicalRole"
        scopeType:
          $ref: "#/components/schemas/ScopeType"
        scopeId:
          type: ["string", "null"]
          format: uuid
        startsAt:
          type: ["string", "null"]
          format: date-time
        endsAt:
          type: ["string", "null"]
          format: date-time
        reason:
          type: string
          minLength: 1
    RoleBindingUpdate:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          $ref: "#/components/schemas/BindingStatus"
        startsAt:
          type: ["string", "null"]
          format: date-time
        endsAt:
          type: ["string", "null"]
          format: date-time
        reason:
          type: string
          minLength: 1
    RoleBindingRevocation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
    AuthorizationCheckInput:
      type: object
      additionalProperties: false
      required: [permission]
      properties:
        permission:
          type: string
          pattern: "^[A-Z_]+\\.[A-Z_]+$"
        resourceId:
          type: string
          format: uuid
    AuthorizationDecision:
      type: object
      required: [allowed, reasonCode, permission]
      properties:
        allowed:
          type: boolean
        reasonCode:
          type: string
          enum:
            - AUTH_REQUIRED
            - USER_INACTIVE
            - ORGANIZATION_MISMATCH
            - ROLE_NOT_ASSIGNED
            - BINDING_INACTIVE
            - PERMISSION_NOT_GRANTED
            - RESOURCE_NOT_FOUND
            - SCOPE_DENIED
            - ASSIGNMENT_REQUIRED
            - OWNERSHIP_REQUIRED
            - VENDOR_SCOPE_DENIED
            - EXPLICIT_DENY
            - POLICY_DENIED
            - PERMISSION_GRANTED
        permission:
          type: string
        scopeType:
          oneOf:
            - $ref: "#/components/schemas/ScopeType"
            - type: "null"
    AuthorizationProfile:
      type: object
      required: [organizationId, roles, permissions, scopes]
      properties:
        organizationId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalRole"
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: object
            required: [role, scopeType]
            properties:
              role:
                $ref: "#/components/schemas/CanonicalRole"
              scopeType:
                $ref: "#/components/schemas/ScopeType"
              scopeId:
                type: ["string", "null"]
                format: uuid