openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: NEXUS-FM foundation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: foundation
  - name: authorization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session:
    get:
      operationId: getSession
      tags: [foundation]
      summary: Get the authenticated user's NEXUS-FM session
      responses:
        "200":
          description: Current application session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSession"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User has no active NEXUS-FM membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /organizations:
    get:
      operationId: listOrganizations
      tags: [foundation]
      summary: List organizations available to the authenticated user
      responses:
        "200":
          description: Accessible organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationAccess"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /session/organization:
    put:
      operationId: selectOrganization
      tags: [foundation]
      summary: Select the active organization context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSelection"
      responses:
        "200":
          description: Updated application session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSession"
        "400":
          description: Invalid organization selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Organization access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /foundation/summary:
    get:
      operationId: getFoundationSummary
      tags: [foundation]
      summary: Get foundation readiness for the active organization
      responses:
        "200":
          description: Foundation readiness summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Active organization context required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /permissions:
    get:
      operationId: listPermissions
      tags: [authorization]
      summary: List canonical permissions
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /roles:
    get:
      operationId: listRoles
      tags: [authorization]
      summary: List canonical roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /roles/{roleId}/permissions:
    parameters:
      - {$ref: "#/components/parameters/RoleId"}
    get:
      operationId: getRolePermissions
      tags: [authorization]
      summary: Read role permissions
      responses:
        "200":
          description: Role permission assignments
          headers:
            ETag:
              description: Exact role policyVersion required by a replacement PUT.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePermissionsResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: updateRolePermissions
      tags: [authorization]
      summary: Replace role permissions
      description: The If-Match header or body policyVersion is the exact role policy version. Stale versions are rejected to prevent lost concurrent updates; omitted canonical capabilities are persisted as explicit DENY entries.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissionUpdate"
      responses:
        "200":
          description: Updated role permission assignments
          headers:
            ETag:
              description: New role policyVersion.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePermissionsResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Stale role policy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePermissionConflict"
        "428": {$ref: "#/components/responses/PreconditionRequired"}
  /audit-logs:
    get:
      operationId: getAuthorizationAuditLogs
      tags: [authorization]
      summary: Read authorization audit history
      description: Returns immutable authorization audit records. Non-platform administrators are restricted to the active organization; platform administrators may read all organizations. Results can be filtered by resource and resourceId.
      parameters:
        - name: resource
          in: query
          required: false
          schema: {type: string}
        - name: resourceId
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: Authorization audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorizationAuditLog"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /users/{userId}/role-bindings:
    parameters:
      - {$ref: "#/components/parameters/UserId"}
    get:
      operationId: getUserRoleBindings
      tags: [authorization]
      summary: Read a user's scoped role bindings
      responses:
        "200":
          description: Role bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRoleBinding"
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createUserRoleBinding
      tags: [authorization]
      summary: Create a scoped role binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleBindingInput"
      responses:
        "201":
          description: Created role binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleBinding"
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /users/{userId}/role-bindings/{bindingId}:
    parameters:
      - {$ref: "#/components/parameters/UserId"}
      - {$ref: "#/components/parameters/BindingId"}
    patch:
      operationId: updateUserRoleBinding
      tags: [authorization]
      summary: Update or revoke a scoped role binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleBindingUpdate"
      responses:
        "200":
          description: Updated role binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleBinding"
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: revokeUserRoleBinding
      tags: [authorization]
      summary: Revoke a scoped role binding
      responses:
        "200":
          description: Revoked role binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleBinding"
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /me/permissions:
    get:
      operationId: getMyPermissions
      tags: [authorization]
      summary: Introspect current permissions
      responses:
        "200":
          description: Current user permissions and scopes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPermissions"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /me/scope:
    get:
      operationId: getMyScope
      tags: [authorization]
      summary: Introspect current role bindings
      responses:
        "200":
          description: Current user role bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRoleBinding"
        "401": {$ref: "#/components/responses/Unauthorized"}
  /authorization/check:
    post:
      operationId: checkAuthorization
      tags: [authorization]
      summary: Development-only diagnostic permission check
      description: This endpoint is disabled in production and actionContext is diagnostic only; it cannot prove production object relationships or replace service-side resource resolution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationCheck"
      responses:
        "200":
          description: Allow decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationDecision"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  parameters:
    RoleId: {name: roleId, in: path, required: true, schema: {type: string, format: uuid}}
    UserId: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    BindingId: {name: bindingId, in: path, required: true, schema: {type: string, format: uuid}}
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Exact role policyVersion token returned as the ETag header. If omitted, the request body policyVersion is used.
      schema: {type: string}
  responses:
    Unauthorized:
      description: Authentication required
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Forbidden:
      description: Authorization denied
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    BadRequest:
      description: Invalid request
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    NotFound:
      description: Resource not found
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Conflict:
      description: Policy version or resource conflict
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    PreconditionRequired:
      description: An exact policy version precondition is required
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    CanonicalRole:
      type: string
      enum:
        - PLATFORM_ADMIN
        - FACILITY_MANAGER
        - FACILITY_SUPERVISOR
        - INSPECTOR
        - MAINTENANCE_TECHNICIAN
        - WAREHOUSE_SUPERVISOR
        - VENDOR
    Organization:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    OrganizationAccess:
      type: object
      required: [organization, role]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        role:
          $ref: "#/components/schemas/CanonicalRole"
    AppUser:
      type: object
      required: [id, externalAuthId, displayName, email]
      properties:
        id:
          type: string
          format: uuid
        externalAuthId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
    AppSession:
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: "#/components/schemas/AppUser"
        activeOrganization:
          oneOf:
            - $ref: "#/components/schemas/OrganizationAccess"
            - type: "null"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationAccess"
    OrganizationSelection:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid
    FoundationSummary:
      type: object
      required:
        - organization
        - currentRole
        - memberCount
        - canonicalRoleCount
        - authenticationStatus
        - organizationContextStatus
        - authorizationStatus
        - auditStatus
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        currentRole:
          $ref: "#/components/schemas/CanonicalRole"
        memberCount:
          type: integer
          minimum: 0
        canonicalRoleCount:
          type: integer
          minimum: 0
        authenticationStatus:
          type: string
          enum: [READY]
        organizationContextStatus:
          type: string
          enum: [READY]
        authorizationStatus:
          type: string
          enum: [MINIMUM_RBAC]
        auditStatus:
          type: string
          enum: [ACTIVE]
    Permission:
      type: object
      required: [id, code, resource, action, status]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: "^[A-Z_]+\\.[A-Z_]+$"}
        resource: {type: string}
        action: {type: string}
        description: {type: string}
        status: {type: string, enum: [ACTIVE, DEPRECATED]}
    Role:
      type: object
      required: [id, code, status, updatedAt, policyVersion]
      properties:
        id: {type: string, format: uuid}
        code: {$ref: "#/components/schemas/CanonicalRole"}
        description: {type: string}
        status: {type: string, enum: [ACTIVE, DEPRECATED]}
        updatedAt: {type: string, format: date-time}
        policyVersion: {type: string, format: uuid}
    ScopeType:
      type: string
      enum: [PLATFORM, ORGANIZATION, PORTFOLIO, FACILITY, BUILDING, SPACE, ASSET, ASSIGNED, TEAM, VENDOR_ASSIGNMENT, OWNED_REQUEST]
    RolePermission:
      type: object
      required: [permissionId, defaultScopeType, effect]
      properties:
        id: {type: string, format: uuid}
        permissionId: {type: string, format: uuid}
        code: {type: string}
        defaultScopeType: {$ref: "#/components/schemas/ScopeType"}
        effect: {type: string, enum: [ALLOW, DENY]}
    RolePermissionsResponse:
      type: object
      required: [permissions, policyVersion]
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/RolePermission"
        policyVersion: {type: string, format: uuid}
    RolePermissionUpdate:
      type: object
      required: [permissions, policyVersion]
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/RolePermission"
        policyVersion: {type: string, format: uuid}
    RolePermissionConflict:
      type: object
      required: [error, policyVersion]
      properties:
        error: {type: string}
        policyVersion: {type: string, format: uuid}
    UserRoleBinding:
      type: object
      required: [id, userId, organizationId, roleId, version, scopeType, status]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        organizationId: {type: string, format: uuid}
        roleId: {type: string, format: uuid}
        version: {type: string, format: uuid}
        scopeType: {$ref: "#/components/schemas/ScopeType"}
        scopeId: {type: string, format: uuid, nullable: true}
        status: {type: string, enum: [ACTIVE, SUSPENDED, EXPIRED]}
        startsAt: {type: string, format: date-time, nullable: true}
        endsAt: {type: string, format: date-time, nullable: true}
    UserRoleBindingInput:
      type: object
      required: [organizationId, roleId, scopeType]
      properties:
        organizationId: {type: string, format: uuid}
        roleId: {type: string, format: uuid}
        scopeType: {$ref: "#/components/schemas/ScopeType"}
        scopeId: {type: string, format: uuid, nullable: true}
        startsAt: {type: string, format: date-time, nullable: true}
        endsAt: {type: string, format: date-time, nullable: true}
    UserRoleBindingUpdate:
      type: object
      properties:
        status: {type: string, enum: [ACTIVE, SUSPENDED, EXPIRED]}
        scopeType: {$ref: "#/components/schemas/ScopeType"}
        scopeId: {type: string, format: uuid, nullable: true}
        endsAt: {type: string, format: date-time, nullable: true}
    AuthorizationCheck:
      type: object
      required: [permission, resourceType]
      properties:
        permission: {type: string}
        resourceType: {type: string}
        resourceId: {type: string}
        context: {type: object, additionalProperties: true}
    AuthorizationDecision:
      type: object
      required: [allowed, reasonCode, permission]
      properties:
        allowed: {type: boolean}
        reasonCode: {type: string}
        permission: {type: string}
        scopeType: {type: string}
    PermissionGrant:
      type: object
      required: [code, scopeType, effect]
      properties:
        code: {type: string}
        scopeType: {$ref: "#/components/schemas/ScopeType"}
        effect: {type: string, enum: [ALLOW, DENY]}
    MyPermissions:
      type: object
      required: [organizationId, permissions]
      properties:
        organizationId: {type: string, format: uuid}
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionGrant"
    AuthorizationAuditLog:
      type: object
      required: [id, organizationId, actorUserId, action, resource, resourceId, decision, reasonCode, scopeEvaluated, requestId, beforeState, afterState, createdAt]
      properties:
        id: {type: string, format: uuid}
        organizationId: {type: ["string", "null"], format: uuid}
        actorUserId: {type: ["string", "null"], format: uuid}
        action: {type: string}
        resource: {type: string}
        resourceId: {type: ["string", "null"]}
        decision: {type: string, enum: [ALLOW, DENY]}
        reasonCode: {type: string}
        scopeEvaluated: {type: ["string", "null"]}
        requestId: {type: ["string", "null"]}
        beforeState: {type: ["string", "null"]}
        afterState: {type: ["string", "null"]}
        createdAt: {type: string, format: date-time}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string