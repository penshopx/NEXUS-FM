openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: NEXUS-FM foundation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: foundation
  - name: authorization
  - name: registry
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session:
    get:
      operationId: getSession
      tags: [foundation]
      summary: Get the authenticated user's NEXUS-FM session
      responses:
        "200":
          description: Current application session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSession"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User has no active NEXUS-FM membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /organizations:
    get:
      operationId: listOrganizations
      tags: [foundation]
      summary: List organizations available to the authenticated user
      responses:
        "200":
          description: Accessible organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationAccess"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /session/organization:
    put:
      operationId: selectOrganization
      tags: [foundation]
      summary: Select the active organization context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSelection"
      responses:
        "200":
          description: Updated application session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSession"
        "400":
          description: Invalid organization selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Organization access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /foundation/summary:
    get:
      operationId: getFoundationSummary
      tags: [foundation]
      summary: Get foundation readiness for the active organization
      responses:
        "200":
          description: Foundation readiness summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Active organization context required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /permissions:
    get:
      operationId: listPermissions
      tags: [authorization]
      summary: List canonical permissions
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /roles:
    get:
      operationId: listRoles
      tags: [authorization]
      summary: List canonical roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /roles/{roleId}/permissions:
    parameters:
      - {$ref: "#/components/parameters/RoleId"}
    get:
      operationId: getRolePermissions
      tags: [authorization]
      summary: Read role permissions
      responses:
        "200":
          description: Role permission assignments
          headers:
            ETag:
              description: Exact role policyVersion required by a replacement PUT.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePermissionsResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: updateRolePermissions
      tags: [authorization]
      summary: Replace role permissions
      description: The If-Match header or body policyVersion is the exact role policy version. Stale versions are rejected to prevent lost concurrent updates; omitted canonical capabilities are persisted as explicit DENY entries.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissionUpdate"
      responses:
        "200":
          description: Updated role permission assignments
          headers:
            ETag:
              description: New role policyVersion.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePermissionsResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Stale role policy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePermissionConflict"
        "428": {$ref: "#/components/responses/PreconditionRequired"}
  /audit-logs:
    get:
      operationId: getAuthorizationAuditLogs
      tags: [authorization]
      summary: Read authorization audit history
      description: Returns immutable authorization audit records. Non-platform administrators are restricted to the active organization; platform administrators may read all organizations. Results can be filtered by resource and resourceId.
      parameters:
        - name: resource
          in: query
          required: false
          schema: {type: string}
        - name: resourceId
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: Authorization audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorizationAuditLog"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /users/search:
    get:
      operationId: searchOrganizationMembers
      tags: [authorization]
      summary: Search active organization members
      description: >-
        Searches active users with active organization memberships by
        display name or email. Platform administrators may optionally
        narrow results to one organization; non-platform administrators are
        always restricted to their active organization regardless of the
        organizationId parameter.
      parameters:
        - name: query
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 100}
        - name: organizationId
          in: query
          required: false
          description: Restrict results to one organization. Only honored for platform administrators.
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/Page"}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: Matching active organization members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberSearchPage"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /organizations/search:
    get:
      operationId: searchPlatformOrganizations
      tags: [authorization]
      summary: Search the platform organization directory
      description: >-
        Searches active organizations by name or slug. This directory is
        available only to administrators whose USER.VIEW permission has
        platform scope.
      parameters:
        - name: query
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 100}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: Matching active organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformOrganizationSearchResult"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /role-binding-scope-targets:
    get:
      operationId: searchRoleBindingScopeTargets
      tags: [authorization]
      summary: Search valid targets for a role binding scope
      description: >-
        Returns active targets in the requested organization. Platform
        administrators may search any organization; other administrators are
        restricted to their active organization.
      parameters:
        - name: scopeType
          in: query
          required: true
          schema: {$ref: "#/components/schemas/ScopeType"}
        - name: organizationId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: query
          in: query
          required: false
          schema: {type: string, maxLength: 100}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: Selectable scope targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleBindingScopeTarget"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createRoleBindingScopeTarget
      tags: [authorization]
      summary: Create a team or vendor-assignment scope target
      description: >-
        Creates an active, organization-owned directory record that can be
        selected for new role bindings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleBindingScopeTargetInput"
      responses:
        "201":
          description: Created scope target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBindingScopeTarget"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /users/{userId}/role-bindings:
    parameters:
      - {$ref: "#/components/parameters/UserId"}
    get:
      operationId: getUserRoleBindings
      tags: [authorization]
      summary: Read a user's scoped role bindings
      description: Filters and pagination are applied only after the caller's platform or active-organization scope restriction. Results are ordered newest first with binding ID as a stable tie-breaker.
      parameters:
        - name: roleCode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CanonicalRole"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserRoleBindingStatus"
        - {$ref: "#/components/parameters/Page"}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: Paginated role bindings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleBindingPage"
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createUserRoleBinding
      tags: [authorization]
      summary: Create a scoped role binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleBindingInput"
      responses:
        "201":
          description: Created role binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleBinding"
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /users/{userId}/role-bindings/export:
    parameters:
      - {$ref: "#/components/parameters/UserId"}
    get:
      operationId: exportUserRoleBindings
      tags: [authorization]
      summary: Export a user's filtered scoped role bindings as CSV
      description: Applies the same canonical-role, lifecycle-status, platform, and active-organization restrictions as the on-screen role-binding list. The export is not paginated.
      parameters:
        - name: roleCode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CanonicalRole"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserRoleBindingStatus"
      responses:
        "200":
          description: Filtered role-binding review CSV
          headers:
            Content-Disposition:
              description: Attachment filename for the exported review.
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /users/{userId}/role-bindings/{bindingId}:
    parameters:
      - {$ref: "#/components/parameters/UserId"}
      - {$ref: "#/components/parameters/BindingId"}
    patch:
      operationId: updateUserRoleBinding
      tags: [authorization]
      summary: Update or revoke a scoped role binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleBindingUpdate"
      responses:
        "200":
          description: Updated role binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleBinding"
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: revokeUserRoleBinding
      tags: [authorization]
      summary: Revoke a scoped role binding
      responses:
        "200":
          description: Revoked role binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleBinding"
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /me/permissions:
    get:
      operationId: getMyPermissions
      tags: [authorization]
      summary: Introspect current permissions
      responses:
        "200":
          description: Current user permissions and scopes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPermissions"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /me/scope:
    get:
      operationId: getMyScope
      tags: [authorization]
      summary: Introspect current role bindings
      responses:
        "200":
          description: Current user role bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRoleBinding"
        "401": {$ref: "#/components/responses/Unauthorized"}
  /authorization/check:
    post:
      operationId: checkAuthorization
      tags: [authorization]
      summary: Development-only diagnostic permission check
      description: This endpoint is disabled in production and actionContext is diagnostic only; it cannot prove production object relationships or replace service-side resource resolution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationCheck"
      responses:
        "200":
          description: Allow decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationDecision"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /facilities:
    get:
      operationId: listFacilities
      tags: [registry]
      summary: List facilities in the active organization
      parameters:
        - {$ref: "#/components/parameters/Search"}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Facilities, content: {application/json: {schema: {$ref: "#/components/schemas/RegistryPage"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createFacility
      tags: [registry]
      summary: Register a facility in the active organization
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "201": {description: Created facility, content: {application/json: {schema: {$ref: "#/components/schemas/Facility"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /facilities/import-template:
    get:
      operationId: downloadFacilityPortfolioImportTemplate
      tags: [registry]
      summary: Download the CSV template for portfolio imports
      responses:
        "200":
          description: Empty CSV template with the exact import header
          content:
            text/csv:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /facilities/import:
    post:
      operationId: importFacilityPortfolio
      tags: [registry]
      summary: Validate and atomically import a facility portfolio
      description: Accepts a bounded CSV containing facilities, buildings, spaces, systems, and assets. Invalid CSV is returned as a downloadable row-level error report and never mutates the portfolio.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
              maxLength: 2097152
      responses:
        "201":
          description: Portfolio imported in one transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioImportResult"
        "400":
          description: CSV validation failed; response is a downloadable error report
          content:
            text/csv:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413":
          description: CSV exceeds the upload byte limit
          content:
            text/csv:
              schema: {type: string}
  /facilities/import/validate:
    post:
      operationId: validateFacilityPortfolioImport
      tags: [registry]
      summary: Validate and preview a facility portfolio CSV without writing records
      description: Uses the same parsing, hierarchy, duplicate, and authorization rules as commit. No registry or audit mutation records are written.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
              maxLength: 2097152
      responses:
        "200":
          description: Valid portfolio import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioImportPreview"
        "400":
          description: CSV validation failed; response is a downloadable error report
          content:
            text/csv:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413":
          description: CSV exceeds the upload byte limit
          content:
            text/csv:
              schema: {type: string}
  /facilities/search:
    get:
      operationId: searchFacilities
      tags: [registry]
      summary: Search facilities in the active organization
      parameters: [{name: q, in: query, required: true, schema: {type: string}}]
      responses:
        "200": {description: Search results, content: {application/json: {schema: {$ref: "#/components/schemas/RegistryPage"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /facilities/export:
    get:
      operationId: exportFacilities
      tags: [registry]
      summary: Export authorized facilities as CSV
      responses:
        "200": {description: CSV export, content: {text/csv: {schema: {type: string}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /facilities/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getFacility
      tags: [registry]
      summary: Get a facility after ancestor and scope verification
      responses:
        "200": {description: Facility, content: {application/json: {schema: {$ref: "#/components/schemas/Facility"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateFacility
      tags: [registry]
      summary: Update a facility
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "200": {description: Updated facility, content: {application/json: {schema: {$ref: "#/components/schemas/Facility"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: replaceFacility
      tags: [registry]
      summary: Replace mutable facility fields
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "200": {description: Updated facility, content: {application/json: {schema: {$ref: "#/components/schemas/Facility"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteFacility
      tags: [registry]
      summary: Delete a facility and its descendants
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /facilities/{id}/buildings:
    post:
      operationId: createFacilityBuilding
      tags: [registry]
      summary: Create a building nested under a facility
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "201": {description: Created building, content: {application/json: {schema: {$ref: "#/components/schemas/Building"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    get:
      operationId: listFacilityBuildings
      tags: [registry]
      summary: List buildings nested under a facility
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/Search"}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Buildings, content: {application/json: {schema: {$ref: "#/components/schemas/RegistryPage"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /buildings/search:
    get:
      operationId: searchBuildings
      tags: [registry]
      summary: Search buildings in the active organization
      parameters: [{name: q, in: query, required: true, schema: {type: string}}]
      responses:
        "200": {description: Search results, content: {application/json: {schema: {$ref: "#/components/schemas/RegistryPage"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /buildings/export:
    get:
      operationId: exportBuildings
      tags: [registry]
      summary: Export authorized buildings as CSV
      responses:
        "200": {description: CSV export, content: {text/csv: {schema: {type: string}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /buildings/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getBuilding
      tags: [registry]
      summary: Get a building
      responses:
        "200": {description: Building, content: {application/json: {schema: {$ref: "#/components/schemas/Building"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateBuilding
      tags: [registry]
      summary: Update a building
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "200": {description: Updated building, content: {application/json: {schema: {$ref: "#/components/schemas/Building"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: replaceBuilding
      tags: [registry]
      summary: Replace mutable building fields
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "200": {description: Updated building, content: {application/json: {schema: {$ref: "#/components/schemas/Building"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      operationId: deleteBuilding
      tags: [registry]
      summary: Delete a building
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
