kind = "web"
previewPath = "/"
title = "TATABANGUN"
description = "Sistem Tata Kelola Gedung, Gudang, dan Infrastruktur. Kelola fasilitasnya. Pastikan kompetensinya. Buktikan kepatuhannya."
version = "1.0.0"
id = "artifacts/nexus-fm"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19562

[services.development]
run = "pnpm --filter @workspace/nexus-fm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexus-fm", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexus-fm/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19562"
BASE_PATH = "/"